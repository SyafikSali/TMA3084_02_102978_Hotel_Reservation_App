name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Verify test coverage is at least 60%
        run: |
          LCOV_PATH="coverage/lcov.info"
          if [ ! -f "$LCOV_PATH" ]; then
            echo "Coverage report not found at $LCOV_PATH"
            exit 1
          fi

          LF=$(awk -F: '/^LF:/ {sum += $2} END {print sum+0}' "$LCOV_PATH")
          LH=$(awk -F: '/^LH:/ {sum += $2} END {print sum+0}' "$LCOV_PATH")

          if [ "$LF" -eq 0 ]; then
            echo "No executable lines found in coverage report."
            exit 1
          fi

          PCT=$(awk -v hit="$LH" -v total="$LF" 'BEGIN {printf "%.2f", (hit / total) * 100}')
          echo "Total test coverage: ${PCT}% (${LH}/${LF} lines)"

          awk -v hit="$LH" -v total="$LF" 'BEGIN {
            pct = (hit / total) * 100;
            if (pct < 60) {
              printf "Coverage (%.2f%%) is below the required 60%% threshold.\n", pct;
              exit 1;
            }
          }'

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error